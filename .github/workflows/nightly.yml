name: nightly

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: $( echo ${{ github.event.head_commit.id }} | cut -c1-7 )
      COMMIT: $( sed -E "s/(.*) <.*@.*>/\\1/g;t" <<< "${{ github.event.head_commit.message }}" | jq -Rsa . | tail -c +2 | head -c -2 )
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook KeyStore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > $GITHUB_WORKSPACE/signing-key.jks

      - name: Cook Google Services
        if: env.GOOGLE_SERVICES_B64 != ''
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: echo "$GOOGLE_SERVICES_B64" | base64 -d > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          if [ -f "$GITHUB_WORKSPACE/signing-key.jks" ]; then
            ./gradlew assembleNightly \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/signing-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.PASSWORD }} \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=${{ secrets.PASSWORD }}
            mkdir -p app/build
            cp app/build/outputs/apk/nightly/app-nightly.apk app/build/app-release.apk
          else
            ./gradlew assembleDebug
            mkdir -p app/build
            cp app/build/outputs/apk/debug/app-debug.apk app/build/app-release.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: app/build/app-release.apk

      - name: Upload APK to Discord
        if: env.WEBHOOK != ''
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK }}
        run: |
          message=$(echo "@everyone **${{ env.VERSION }}**\n${{ env.COMMIT }}")
          curl -F "payload_json={\"content\":\"${message}\"}" \
          -F "echo_beta=@app/build/app-release.apk" \
          $WEBHOOK

      - name: Upload APK to Telegram
        if: env.BOT_ID != '' && env.CHANNEL_ID != ''
        shell: bash
        env:
          BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          regex='s/[\_\*\[\]\(\)\~\`\>\#\+\-\=\|\{\}\.\!]/\\&/g'
          message=$(printf "*Nightly Release*\n${{ env.COMMIT }}" | sed -E "$regex")
          curl -F "chat_id=${BOT_ID}" \
          -F "message_thread_id=${THREAD_ID}" \
          -F "document=@app/build/app-release.apk" \
          -F "caption=${message}" \
          -F "parse_mode=MarkdownV2" \
          https://api.telegram.org/bot${BOT_ID}/sendDocument
