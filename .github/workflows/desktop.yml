name: Build Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Build Desktop Distributable with Gradle
        run: .\gradlew.bat :desktopApp:createDistributable --no-daemon

      - name: Upload Desktop Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audix-Desktop-Windows
          path: desktopApp/build/compose/binaries/main/app/
